[project]
name = "desktop-search-agent"
version = "0.1.0"
description = "Local RAG desktop search agent with Claude + ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Murali Sepna" }]
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "fastembed>=0.4.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "typer>=0.13.0",
    "streamlit>=1.40.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "watchdog>=6.0.0",
    "tiktoken>=0.8.0",
    # Pin below 1.21 — onnxruntime dropped Intel macOS wheels starting at 1.21.
    # Pulled in transitively by chromadb; we don't use its default embedding function.
    "onnxruntime>=1.18,<1.21",
]

[project.scripts]
dsa = "desktop_search.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_search"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
